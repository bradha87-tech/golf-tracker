<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="연선태경 골프" />
<meta name="theme-color" content="#0f172a" />
<title>연선·태경 골프 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --rose: #f43f5e;
    --rose-light: #ffe4e6;
    --emerald: #10b981;
    --emerald-light: #d1fae5;
    --sky: #0ea5e9;
    --ink: #0f172a;
    --ink2: #1e293b;
    --slate: #64748b;
    --muted: #f1f5f9;
    --white: #ffffff;
    --card-bg: rgba(255,255,255,0.88);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #fdf2f8 0%, #f0fdf4 50%, #f0f9ff 100%);
    min-height: 100%;
    color: var(--ink);
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bot) + 80px);
    -webkit-font-smoothing: antialiased;
  }

  /* TABS */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--ink);
    display: flex;
    padding-bottom: var(--safe-bot);
    z-index: 100;
    backdrop-filter: blur(20px);
  }
  .tab-btn {
    flex: 1;
    background: none; border: none;
    color: rgba(255,255,255,0.45);
    padding: 12px 0 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 10px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; transition: color 0.18s;
  }
  .tab-btn.active { color: #fff; }
  .tab-btn .tab-icon { font-size: 22px; }

  /* PAGES */
  .page { display: none; padding: 16px 14px 8px; }
  .page.active { display: block; }

  /* HEADER */
  .header {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }
  .header-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--rose-light); color: var(--rose);
    border-radius: 999px; padding: 5px 14px;
    font-size: 12px; font-weight: 900; margin-bottom: 10px;
  }
  .header-title { font-size: 26px; font-weight: 900; line-height: 1.2; }
  .header-sub { font-size: 13px; color: var(--slate); margin-top: 6px; }

  /* STAT CARDS */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 3px 16px rgba(0,0,0,0.06);
  }
  .stat-label { font-size: 10px; font-weight: 700; color: var(--slate); margin-bottom: 4px; }
  .stat-name { font-size: 18px; font-weight: 900; }
  .stat-count-badge {
    display: inline-block;
    background: var(--ink); color: #fff;
    border-radius: 10px; padding: 3px 10px;
    font-size: 11px; font-weight: 900;
    margin-bottom: 10px;
  }
  .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini-stat {
    background: var(--muted);
    border-radius: 14px; padding: 10px 8px; text-align: center;
  }
  .mini-stat-val { font-size: 20px; font-weight: 900; }
  .mini-stat-lbl { font-size: 10px; color: var(--slate); font-weight: 700; margin-top: 2px; }

  /* MAP */
  .map-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .map-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .map-title { font-size: 18px; font-weight: 900; }
  .map-sub { font-size: 11px; color: var(--slate); margin-top: 2px; }
  .count-chip {
    background: var(--emerald-light); color: var(--emerald);
    border-radius: 999px; padding: 4px 12px;
    font-size: 12px; font-weight: 900;
  }
  .map-wrap {
    position: relative;
    height: 280px;
    border-radius: 20px;
    overflow: hidden;
    background: #dff3f6;
  }
  .map-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map-pins { position: absolute; inset: 0; }
  .map-pin {
    position: absolute; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; transition: transform 0.15s;
  }
  .map-pin:active { transform: translate(-50%, -100%) scale(1.15); }
  .pin-circle {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: #fff;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    border: 3px solid rgba(255,255,255,0.8);
  }
  .pin-circle.selected { background: var(--rose) !important; border-color: var(--rose-light); }
  .pin-circle.known { background: #16a34a; }
  .pin-circle.unknown { background: #64748b; }
  .pin-label {
    margin-top: 3px;
    background: rgba(255,255,255,0.9);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 9px; font-weight: 900; color: var(--ink);
    max-width: 90px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  }
  .pin-label.selected { background: var(--rose-light); color: var(--rose); }
  .map-region-label {
    position: absolute;
    font-size: 11px; font-weight: 900; color: #334155;
    pointer-events: none;
  }

  /* MAP DETAIL */
  .detail-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .detail-chip {
    background: #e0f2fe; color: var(--sky);
    border-radius: 999px; padding: 4px 12px;
    font-size: 11px; font-weight: 900;
    display: inline-block; margin-bottom: 8px;
  }
  .detail-course-name { font-size: 20px; font-weight: 900; }
  .detail-round {
    background: var(--muted);
    border-radius: 16px; padding: 12px; margin-top: 10px;
  }
  .detail-round-top {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .detail-round-date { font-weight: 900; font-size: 13px; }
  .detail-round-holes { font-size: 11px; color: var(--slate); font-weight: 700; }
  .score-badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .score-badge {
    border-radius: 14px; padding: 10px; text-align: center;
  }
  .score-badge.rose { background: var(--rose-light); color: var(--rose); }
  .score-badge.emerald { background: var(--emerald-light); color: #065f46; }
  .score-badge.neutral { background: #f8fafc; color: var(--ink); }
  .score-badge-name { font-size: 10px; font-weight: 900; }
  .score-badge-val { font-size: 24px; font-weight: 900; }
  .score-badge-unit { font-size: 10px; opacity: 0.6; }

  /* ADD ROUND */
  .form-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .form-hd { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .form-hd-icon {
    width: 42px; height: 42px;
    background: var(--rose); color: #fff;
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; flex-shrink: 0;
  }
  .form-hd-title { font-size: 18px; font-weight: 900; }
  .form-hd-sub { font-size: 11px; color: var(--slate); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 900; margin-bottom: 6px; color: var(--ink2); }
  .field input[type=text], .field input[type=date] {
    width: 100%;
    border-radius: 16px;
    border: 1.5px solid #e2e8f0;
    padding: 13px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px; font-weight: 700;
    background: var(--muted);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(14,165,233,0.13); }
  .score-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .score-input-wrap {
    background: var(--muted);
    border-radius: 16px; padding: 14px;
  }
  .score-input-lbl { font-size: 12px; font-weight: 900; margin-bottom: 8px; display: block; }
  .score-num-ctrl {
    display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .score-num-ctrl button {
    width: 36px; height: 36px;
    border-radius: 50%; border: none;
    background: #fff; color: var(--ink);
    font-size: 22px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    flex-shrink: 0;
  }
  .score-num-display {
    font-size: 28px; font-weight: 900; min-width: 48px; text-align: center;
  }
  .btn-add {
    width: 100%; padding: 16px;
    background: var(--ink); color: #fff;
    border: none; border-radius: 18px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px; font-weight: 900;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    margin-top: 6px;
  }
  .btn-add:active { transform: scale(0.98); background: var(--rose); }

  /* HISTORY */
  .history-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .history-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .history-title { font-size: 18px; font-weight: 900; }
  .history-sub { font-size: 11px; color: var(--slate); }
  .round-item {
    border-radius: 18px;
    border: 1.5px solid #f1f5f9;
    background: #fff;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: box-shadow 0.15s, transform 0.12s;
  }
  .round-item:active { transform: scale(0.99); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .round-item-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .round-course { font-size: 16px; font-weight: 900; }
  .round-meta { font-size: 11px; color: var(--slate); font-weight: 700; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-del {
    background: none; border: none; color: #cbd5e1;
    font-size: 18px; cursor: pointer; padding: 4px;
    border-radius: 10px; transition: color 0.12s, background 0.12s;
  }
  .btn-del:active { color: #ef4444; background: #fee2e2; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff;
    border-radius: 999px; padding: 10px 22px;
    font-size: 13px; font-weight: 700;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 30px 20px; color: var(--slate); font-size: 14px; font-weight: 700; }

  /* Datalist / autocomplete */
  datalist { display: none; }
</style>
</head>
<body>

<!-- PAGES -->
<div id="page-home" class="page active">
  <div class="header">
    <div class="header-badge">⛳ 연선·태경 도장깨기 기록</div>
    <div class="header-title">라운드를<br>예쁘게 남겨요</div>
    <div class="header-sub">골프장과 날짜는 한 번만 입력하고,<br>연선과 태경의 타수를 각각 저장합니다.</div>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">PLAYER</div>
      <div class="stat-name">🌷 연선</div>
      <div class="stat-count-badge" id="ys-count">0회</div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-stat-val" id="ys-avg">-</div><div class="mini-stat-lbl">평균 타수</div></div>
        <div class="mini-stat"><div class="mini-stat-val" id="ys-best">-</div><div class="mini-stat-lbl">베스트</div></div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-label">PLAYER</div>
      <div class="stat-name">🌿 태경</div>
      <div class="stat-count-badge" id="tk-count">0회</div>
      <div class="mini-stats">
        <div class="mini-stat"><div class="mini-stat-val" id="tk-avg">-</div><div class="mini-stat-lbl">평균 타수</div></div>
        <div class="mini-stat"><div class="mini-stat-val" id="tk-best">-</div><div class="mini-stat-lbl">베스트</div></div>
      </div>
    </div>
  </div>

  <div class="map-card">
    <div class="map-header">
      <div><div class="map-title">도장깨기 맵</div><div class="map-sub">방문한 골프장을 지도에서 확인하세요</div></div>
      <div class="count-chip" id="map-count">0곳</div>
    </div>
    <div class="map-wrap">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ecfccb"/>
            <stop offset="52%" stop-color="#bbf7d0"/>
            <stop offset="100%" stop-color="#86efac"/>
          </linearGradient>
          <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d9f99d"/>
            <stop offset="100%" stop-color="#65a30d"/>
          </linearGradient>
          <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/></filter>
        </defs>
        <rect width="100" height="100" fill="#dff3f6"/>
        <path d="M79 6 C85 10 90 20 89 31 C88 44 94 52 91 64 C88 75 78 85 68 91 L53 96 C44 94 39 85 35 77 C30 68 19 65 14 56 C8 45 12 30 21 22 C31 13 43 15 53 10 C62 5 71 1 79 6Z" fill="url(#lg1)" filter="url(#sh)"/>
        <path d="M68 10 C78 19 80 29 76 39 C72 50 76 59 70 70 C65 78 61 83 57 92 L70 89 C80 81 88 73 91 63 C94 52 88 43 89 31 C90 20 85 10 79 6 C75 4 71 6 68 10Z" fill="url(#lg2)" opacity="0.34"/>
        <path d="M21 22 C13 30 8 45 14 56 C19 65 30 68 35 77 C37 82 40 87 44 91 L50 80 C45 70 42 60 43 51 C44 41 39 32 31 27 C28 25 24 23 21 22Z" fill="#bfdbfe" opacity="0.42"/>
        <path d="M65 8 C64 18 65 27 62 35 C59 44 62 51 58 60 C55 67 52 75 53 94" stroke="#15803d" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.35" fill="none"/>
        <path d="M28 27 C34 35 38 44 38 54 C38 64 42 72 50 80" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.28" fill="none"/>
        <path d="M18 58 C28 56 37 57 45 64 C51 69 59 68 68 65" stroke="#0ea5e9" stroke-width="0.9" opacity="0.35" fill="none"/>
        <text x="24" y="48" font-size="4" font-weight="800" fill="#334155">서울</text>
        <text x="34" y="62" font-size="4" font-weight="800" fill="#334155">경기</text>
        <text x="65" y="45" font-size="4" font-weight="800" fill="#334155">강원</text>
        <text x="80" y="45" font-size="3" font-weight="800" fill="#0284c7">동해</text>
      </svg>
      <div class="map-pins" id="map-pins"></div>
    </div>
  </div>

  <div class="detail-card" id="detail-card">
    <div class="empty">지도의 핀을 클릭하면<br>골프장 상세 기록이 보여요</div>
  </div>
</div>

<div id="page-add" class="page">
  <div class="form-card">
    <div class="form-hd">
      <div class="form-hd-icon">＋</div>
      <div><div class="form-hd-title">라운드 추가</div><div class="form-hd-sub">골프장 1곳에 두 사람 점수를 함께 입력하세요</div></div>
    </div>

    <div class="field">
      <label>⛳ 골프장</label>
      <input type="text" id="input-course" placeholder="예: 라비에벨 CC, 샌드파인 GC" list="course-list" autocomplete="off" />
      <datalist id="course-list"></datalist>
    </div>
    <div class="field">
      <label>📅 날짜</label>
      <input type="date" id="input-date" />
    </div>
    <div class="score-inputs">
      <div class="score-input-wrap">
        <span class="score-input-lbl">🌷 연선 타수</span>
        <div class="score-num-ctrl">
          <button onclick="changeScore('ys',-1)">－</button>
          <div class="score-num-display" id="ys-score-disp">92</div>
          <button onclick="changeScore('ys',+1)">＋</button>
        </div>
      </div>
      <div class="score-input-wrap">
        <span class="score-input-lbl">🌿 태경 타수</span>
        <div class="score-num-ctrl">
          <button onclick="changeScore('tk',-1)">－</button>
          <div class="score-num-display" id="tk-score-disp">86</div>
          <button onclick="changeScore('tk',+1)">＋</button>
        </div>
      </div>
    </div>
    <button class="btn-add" onclick="addRound()">함께 기록 남기기 🏌️</button>
  </div>
</div>

<div id="page-history" class="page">
  <div class="history-card">
    <div class="history-hd">
      <div><div class="history-title">라운드 이력 🏆</div><div class="history-sub">최신순으로 정렬됩니다</div></div>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<!-- TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="goTab('home',this)">
    <span class="tab-icon">🗺️</span>홈
  </button>
  <button class="tab-btn" onclick="goTab('add',this)">
    <span class="tab-icon">➕</span>기록추가
  </button>
  <button class="tab-btn" onclick="goTab('history',this)">
    <span class="tab-icon">📋</span>이력
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>

  "자유 CC":{ x:51,y:72,area:"경기 여주",region:"경기" },
  "솔모로 CC":{ x:47,y:70,area:"경기 여주",region:"경기" },
  "블루헤런 GC":{ x:50,y:68,area:"경기 여주",region:"경기" },
  "신안 CC":{ x:34,y:67,area:"경기 안성",region:"경기" },
  "라비에벨 CC":{ x:62,y:42,area:"강원 춘천",region:"강원" },
  "제이드팰리스 GC":{ x:55,y:39,area:"강원 춘천",region:"강원" },
  "오너스 GC":{ x:64,y:39,area:"강원 춘천",region:"강원" },
  "엘리시안 강촌 CC":{ x:55,y:42,area:"강원 춘천",region:"강원" },
  "휘슬링락 CC":{ x:64,y:46,area:"강원 춘천",region:"강원" },
  "오크밸리 CC":{ x:61,y:67,area:"강원 원주",region:"강원" },
  "센추리21 CC":{ x:64,y:70,area:"강원 원주",region:"강원" },
  "동원썬밸리 CC":{ x:61,y:72,area:"강원 횡성",region:"강원" },
  "벨라스톤 CC":{ x:67,y:67,area:"강원 횡성",region:"강원" },
  "샌드파인 GC":{ x:82,y:48,area:"강원 강릉",region:"강원" },
  "메이플비치 골프앤리조트":{ x:84,y:52,area:"강원 강릉",region:"강원" },
  "설해원 CC":{ x:78,y:34,area:"강원 양양",region:"강원" },
  "파인리즈 CC":{ x:75,y:28,area:"강원 고성",region:"강원" },
  "알펜시아 CC":{ x:76,y:61,area:"강원 평창",region:"강원" },
  "용평 GC":{ x:77,y:62,area:"강원 평창",region:"강원" },
};

const SEED = [
  { id:1, course:"레이크사이드 CC", date:"2026-05-02", scores:{ 연선:92, 태경:86 } },
  { id:2, course:"서원밸리 CC",    date:"2026-04-21", scores:{ 연선:95, 태경:89 } },
  { id:3, course:"라비에벨 CC",    date:"2026-03-30", scores:{ 연선:93, 태경:88 } },
  { id:4, course:"샌드파인 GC",    date:"2026-03-15", scores:{ 연선:94, 태경:90 } },
];

let rounds = [];
let ysScore = 92, tkScore = 86;
let selectedCourse = null;

function load() {
  try {
    const s = localStorage.getItem("golfRounds_v2");
    rounds = s ? JSON.parse(s) : SEED;
  } catch { rounds = SEED; }
}
function save() {
  localStorage.setItem("golfRounds_v2", JSON.stringify(rounds));
}

function getCoursePoint(name) {
  const compact = t => t.split(" ").join("").toLowerCase();
  const n = compact(name);
  const ek = Object.keys(COURSE_LOCATIONS).find(k => compact(k) === n);
  if (ek) return COURSE_LOCATIONS[ek];
  const mk = Object.keys(COURSE_LOCATIONS).find(k => { const t=compact(k); return n.includes(t)||t.includes(n); });
  if (mk) return COURSE_LOCATIONS[mk];
  let h=0; for(let i=0;i<name.length;i++) h=name.charCodeAt(i)+((h<<5)-h);
  return { x:24+Math.abs(h%52), y:24+Math.abs((h>>3)%48), area:"직접 입력", region:"미지정" };
}

function getPlayerScore(round, player) { return Number(round.scores?.[player]||0); }

function calcStats(player) {
  const scores = rounds.map(r=>getPlayerScore(r,player)).filter(Boolean);
  if (!scores.length) return { count:0, avg:"-", best:"-" };
  return {
    count: scores.length,
    avg: (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1),
    best: Math.min(...scores)
  };
}

function updateStats() {
  const ys = calcStats("연선"), tk = calcStats("태경");
  document.getElementById("ys-count").textContent = ys.count+"회";
  document.getElementById("ys-avg").textContent = ys.avg;
  document.getElementById("ys-best").textContent = ys.best;
  document.getElementById("tk-count").textContent = tk.count+"회";
  document.getElementById("tk-avg").textContent = tk.avg;
  document.getElementById("tk-best").textContent = tk.best;
  document.getElementById("map-count").textContent = courseVisits().length+"곳";
}

function courseVisits() {
  const g = {};
  rounds.forEach(r => {
    if (!g[r.course]) g[r.course] = { course:r.course, count:0, rounds:[], ...getCoursePoint(r.course) };
    g[r.course].count++;
    g[r.course].rounds.push(r);
  });
  return Object.values(g).sort((a,b)=>b.count-a.count);
}

function renderMap() {
  const visits = courseVisits();
  const container = document.getElementById("map-pins");
  container.innerHTML = "";
  visits.forEach((v, i) => {
    const div = document.createElement("div");
    div.className = "map-pin";
    div.style.left = v.x+"%";
    div.style.top = v.y+"%";
    const isSelected = v.course === selectedCourse;
    const isUnknown = v.region === "미지정";
    div.innerHTML = `
      <div class="pin-circle ${isSelected?"selected":isUnknown?"unknown":"known"}">${i+1}</div>
      <div class="pin-label ${isSelected?"selected":""}">${v.course}</div>
    `;
    div.onclick = () => { selectedCourse = v.course; renderMap(); renderDetail(); };
    container.appendChild(div);
  });
}

function renderDetail() {
  const card = document.getElementById("detail-card");
  const visits = courseVisits();
  const v = visits.find(x=>x.course===selectedCourse) || visits[0];
  if (!v) { card.innerHTML = '<div class="empty">지도의 핀을 클릭하면<br>골프장 상세 기록이 보여요</div>'; return; }
  const sorted = [...v.rounds].sort((a,b)=>b.date.localeCompare(a.date));
  const allScores = v.rounds.flatMap(r=>["연선","태경"].map(p=>getPlayerScore(r,p))).filter(Boolean);
  const bestScore = allScores.length ? Math.min(...allScores) : "-";
  card.innerHTML = `
    <div class="detail-chip">${v.area} · ${v.count}회 방문</div>
    <div class="detail-course-name">${v.course}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0">
      <div class="mini-stat"><div class="mini-stat-val">${v.count}</div><div class="mini-stat-lbl">방문 횟수</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${bestScore}</div><div class="mini-stat-lbl">최저 타수</div></div>
    </div>
    ${sorted.map(r=>{
      const ys=getPlayerScore(r,"연선"), tk=getPlayerScore(r,"태경");
      const w = ys===tk?"동점":ys<tk?"연선":"태경";
      return `<div class="detail-round">
        <div class="detail-round-top"><div class="detail-round-date">📅 ${r.date}</div><div class="detail-round-holes">18홀</div></div>
        <div class="score-badges">
          <div class="score-badge ${w==="연선"?"rose":"neutral"}">
            <div class="score-badge-name">${w==="연선"?"WIN ":""}🌷 연선</div>
            <div class="score-badge-val">${ys}</div>
            <div class="score-badge-unit">타</div>
          </div>
          <div class="score-badge ${w==="태경"?"emerald":"neutral"}">
            <div class="score-badge-name">${w==="태경"?"WIN ":""}🌿 태경</div>
            <div class="score-badge-val">${tk}</div>
            <div class="score-badge-unit">타</div>
          </div>
        </div>
      </div>`;
    }).join("")}
  `;
}

function renderHistory() {
  const list = document.getElementById("history-list");
  const sorted = [...rounds].sort((a,b)=>b.date.localeCompare(a.date));
  if (!sorted.length) { list.innerHTML='<div class="empty">아직 기록이 없어요.<br>라운드를 추가해보세요!</div>'; return; }
  list.innerHTML = sorted.map(r=>{
    const ys=getPlayerScore(r,"연선"), tk=getPlayerScore(r,"태경");
    const w = ys===tk?"동점":ys<tk?"연선":"태경";
    return `<div class="round-item" onclick="viewCourse('${r.course}')">
      <div class="round-item-top">
        <div>
          <div class="round-course">${r.course}</div>
          <div class="round-meta"><span>📅 ${r.date}</span><span>⛳ 18홀</span></div>
        </div>
        <button class="btn-del" onclick="event.stopPropagation();deleteRound(${r.id})">🗑️</button>
      </div>
      <div class="score-badges">
        <div class="score-badge ${w==="연선"?"rose":"neutral"}">
          <div class="score-badge-name">${w==="연선"?"WIN ":""}🌷 연선</div>
          <div class="score-badge-val">${ys}</div>
          <div class="score-badge-unit">타</div>
        </div>
        <div class="score-badge ${w==="태경"?"emerald":"neutral"}">
          <div class="score-badge-name">${w==="태경"?"WIN ":""}🌿 태경</div>
          <div class="score-badge-val">${tk}</div>
          <div class="score-badge-unit">타</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function viewCourse(name) {
  selectedCourse = name;
  goTab('home', document.querySelector('.tab-btn'));
  renderMap(); renderDetail();
}

function renderAll() {
  updateStats(); renderMap(); renderDetail(); renderHistory();
}

function changeScore(who, delta) {
  if (who==='ys') { ysScore = Math.max(50,Math.min(140,ysScore+delta)); document.getElementById("ys-score-disp").textContent=ysScore; }
  else { tkScore = Math.max(50,Math.min(140,tkScore+delta)); document.getElementById("tk-score-disp").textContent=tkScore; }
}

function addRound() {
  const course = document.getElementById("input-course").value.trim();
  const date = document.getElementById("input-date").value;
  if (!course || !date) { showToast("골프장과 날짜를 입력해주세요!"); return; }
  const newRound = { id:Date.now(), course, date, scores:{ 연선:ysScore, 태경:tkScore } };
  rounds.unshift(newRound);
  save();
  selectedCourse = course;
  document.getElementById("input-course").value = "";
  renderAll();
  showToast("라운드가 기록됐어요! 🏌️");
  goTab('home', document.querySelectorAll('.tab-btn')[0]);
}

function deleteRound(id) {
  if (!confirm("이 기록을 삭제할까요?")) return;
  rounds = rounds.filter(r=>r.id!==id);
  save(); renderAll();
  showToast("기록이 삭제됐어요");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function goTab(name, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById("page-"+name).classList.add('active');
  if (btn) btn.classList.add('active');
  else {
    const idx = {home:0,add:1,history:2}[name];
    document.querySelectorAll('.tab-btn')[idx]?.classList.add('active');
  }
  window.scrollTo(0,0);
}

// Init
function init() {
  load();
  // 오늘 날짜
  document.getElementById("input-date").value = new Date().toISOString().slice(0,10);
  // 자동완성 datalist
  const dl = document.getElementById("course-list");
  Object.keys(COURSE_LOCATIONS).forEach(c => {
    const opt = document.createElement("option"); opt.value=c; dl.appendChild(opt);
  });
  // 초기 선택
  const visits = courseVisits();
  if (visits.length) selectedCourse = visits[0].course;
  renderAll();
}

init();
</script>
