<title>연선·태경 골프앱 설치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(135deg,#fdf2f8 0%,#f0fdf4 50%,#f0f9ff 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:env(safe-area-inset-top,24px);padding-bottom:env(safe-area-inset-bottom,24px)}
.card{background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-radius:32px;padding:36px 28px;max-width:400px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,0.10);text-align:center}
.emoji{font-size:56px;margin-bottom:16px;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;background:#ffe4e6;color:#f43f5e;border-radius:999px;padding:6px 16px;font-size:12px;font-weight:900;margin-bottom:16px}
h1{font-size:26px;font-weight:900;line-height:1.2;color:#0f172a;margin-bottom:10px}
.sub{font-size:14px;color:#64748b;margin-bottom:28px;line-height:1.6}
.btn-download{display:block;width:100%;padding:18px;background:#0f172a;color:#fff;border:none;border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:900;cursor:pointer;text-decoration:none;margin-bottom:12px;transition:background 0.15s,transform 0.1s;-webkit-tap-highlight-color:transparent}
.btn-download:active{transform:scale(0.98);background:#f43f5e}
.steps{text-align:left;background:#f8fafc;border-radius:20px;padding:20px;margin-top:4px}
.steps-title{font-size:13px;font-weight:900;color:#0f172a;margin-bottom:12px}
.step{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.step:last-child{margin-bottom:0}
.step-num{width:24px;height:24px;background:#0f172a;color:#fff;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-txt{font-size:13px;color:#334155;font-weight:700;line-height:1.5}
.step-txt span{color:#f43f5e;font-weight:900}
.note{font-size:11px;color:#94a3b8;margin-top:16px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <span class="emoji">⛳</span>
  <div class="badge">연선 · 태경 도장깨기</div>
  <h1>골프 기록 앱<br>설치하기</h1>
  <p class="sub">아래 버튼을 눌러 파일을 받고,<br>Safari로 열어 홈 화면에 추가하면<br>앱처럼 사용할 수 있어요!</p>

  <a id="dl-btn" class="btn-download" download="golf-tracker.html">⬇️ 골프앱 파일 받기</a>

  <div class="steps">
    <div class="steps-title">📱 홈 화면 앱으로 설치하는 방법</div>
    <div class="step"><div class="step-num">1</div><div class="step-txt">위 버튼으로 파일 다운로드</div></div>
    <div class="step"><div class="step-num">2</div><div class="step-txt">파일 앱 → 다운로드 폴더에서 파일 찾기</div></div>
    <div class="step"><div class="step-num">3</div><div class="step-txt">파일을 탭 → <span>Safari로 열기</span> 선택</div></div>
    <div class="step"><div class="step-num">4</div><div class="step-txt">하단 공유버튼(□↑) → <span>홈 화면에 추가</span></div></div>
    <div class="step"><div class="step-num">5</div><div class="step-txt">완료! 홈 화면에서 앱 아이콘으로 실행</div></div>
  </div>
  <p class="note">* 데이터는 기기에 영구 저장됩니다</p>
</div>
